[package]
name = "patisson-binance-sdk"
version = "0.1.12"
edition = "2024"
rust-version = "1.91"
authors = ["Yurii Musolov <yurii.musolov@gmail.com>"]
description = "Unofficial Rust SDK for the Binance exchange API"
keywords = ["binance", "sdk", "crypto", "trading", "cryptocurrency"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
documentation = "https://docs.rs/crate/patisson-binance-sdk"
repository = "https://github.com/yurii-musolov/patisson-binance-sdk"
license = "MIT"
readme = "README.md"
include = [
  "/src/**/*",
  "/examples/**/*",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
]

[lib]
name = "binance"
path = "src/lib.rs"

[features]
# One TLS implementation for both REST (reqwest) and WebSocket (tungstenite).
default = ["rustls-tls"]
# rustls with the aws-lc-rs provider and the platform's root certificates.
rustls-tls = ["reqwest/rustls", "tokio-tungstenite/rustls-tls-native-roots"]
# The platform TLS library (OpenSSL on Linux, needs libssl-dev).
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]
# Tests against the live public API (network, no keys):
# `cargo test --features live --lib live_conformance`.
live = []

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = [
  "sink",
  "std",
] }
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.4", default-features = false, features = [
  "charset",
  "http2",
  "system-proxy",
  "json",
  "query",
  "socks",
] }
rust_decimal = { version = "1.42.1", features = [
  "std",
  "macros",
  "serde-str",
  "serde-with-str",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0" }
tracing = "0.1.44"

[dev-dependencies]
anyhow = "1.0.104"
tokio = { version = "1.52.3", features = ["full", "test-util"] }
serde_ignored = "0.1.14"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
